name: anggit-mono

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${API_PORT:-4000}:4000'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - >-
          fetch('http://127.0.0.1:4000/health').then(response =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    profiles: [tools]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: ${API_URL:-http://api:4000}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - >-
          fetch('http://127.0.0.1:3000').then(response =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
